# Docker-compose reference for the ceki headless-browser provider.
# Token is required at runtime (never commit it here).
#
# IMPORTANT: run ./build.sh first — it stages the browser-extension dist into
# the git-ignored extension/ directory. The Dockerfile's `COPY extension/`
# step fails if that directory is missing, so `up --build` on a fresh clone
# requires build.sh to have run beforehand.
#
#   ./build.sh                        # stage extension dist (required before --build)
#   docker compose up --build -d
#   docker compose logs -f provider
#   docker compose stop provider

services:
  provider:
    build:
      context: .
      dockerfile: Dockerfile
    image: ceki/provider:dev
    environment:
      # REQUIRED: the one-time browser token from your account dashboard.
      # The container starts and stops with a clear error if this is unset.
      - CEKI_PROVIDER_TOKEN=${CEKI_PROVIDER_TOKEN:-}
      # Optional: override the API base URL (defaults to https://api.ceki.me).
      - CEKI_API_URL=${CEKI_API_URL:-}
      # Inherit the host timezone so the provider browser's local time matches
      # the IP geolocation (self-fingerprint consistency).
      - TZ=${TZ:-}
      - DISPLAY=:99
    # One provider browser per container. Scale to run more (each needs its own token).
    restart: unless-stopped
