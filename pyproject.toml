[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceki-browser-provider"
version = "0.1.0"
description = "Ceki headless-browser provider — rent out this machine's browser"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ceki.me", email = "hello@ceki.me"}]
keywords = ["browser", "provider", "ceki", "docker", "automation"]
dependencies = [
    "ceki-sdk==2.36.1",
    "playwright>=1.40",
]

[project.scripts]
ceki-provider = "ceki_browser_provider.app:main"

[tool.hatch.build.targets.wheel]
packages = ["ceki_browser_provider"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
