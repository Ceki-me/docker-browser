# Publishes the provider image when a GitHub Release is published.
#
# This workflow is intentionally NOT triggered on push — it only runs on
# `release: published` (or manually via workflow_dispatch for a lean
# republish), so a plain push/PR never publishes the image.
#
# Primary target: GitHub Container Registry (GHCR) attached to this repo
# (ghcr.io/ceki-me/docker-browser). GHCR needs no secrets — the workflow's
# GITHUB_TOKEN carries packages: write for its own repository.
#
# GHCR creates container packages private by default even in a public repo,
# so after pushing we flip the package visibility to public (the repo-scoped
# GITHUB_TOKEN may update it) — otherwise anonymous `docker pull` fails.
#
# Docker Hub (ceki/provider) push activates automatically once the repo has
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets set; without them the Hub login
# and hub tags are skipped so the job never fails on a missing Hub account.

name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image bundles the browser-extension dist. The dist is fetched from
      # the prod host (https://browser.ceki.me/ext/...) — the same bundle the
      # extension updater serves and the default source ./build.sh uses, so a
      # CI-built image equals a local-built image. This avoids depending on a
      # browser-extension release whose asset name/tag must match this repo's
      # release tag (the old URL could never resolve: no `extension.zip` asset
      # exists there, and release tags differ between the two repos).
      - name: Stage extension dist
        run: |
          set -euo pipefail
          mkdir -p extension
          curl -fsSL -o /tmp/extension.zip \
            "https://browser.ceki.me/ext/ceki-browser-extension-latest.zip"
          unzip -q -o /tmp/extension.zip -d extension
          test -f extension/manifest.json || { \
            echo "error: downloaded bundle has no manifest.json — not a browser-extension dist" >&2; \
            exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: hubcheck
        name: Check Docker Hub secrets
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.hubcheck.outputs.enabled == '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          # Three images, one per browser flavor (each its own Dockerfile):
          #   chromium (Dockerfile)                    -> :latest, :<tag>
          #   yandex (Dockerfile.yandex)               -> :yandex, :<tag>-yandex
          #   pseudo-yandex (Dockerfile.pseudo-yandex) -> :pseudo-yandex, :<tag>-pseudo-yandex
          # The flavor tags are always pushed; the release tag (and Hub tags)
          # only exist on a real Release — on workflow_dispatch there is no
          # tag_name.
          HUB="${{ steps.hubcheck.outputs.enabled }}"
          write_set() { # $1 = flavor suffix ("", -yandex, -pseudo-yandex)
            local suffix="$1"
            # File name mirrors the GITHUB_OUTPUT key: hyphens -> underscores
            # (tags_yandex), and the chromium set (empty suffix) -> tags_chromium.
            local file_suffix="${suffix//-/_}"
            file_suffix="${file_suffix:-_chromium}"
            {
              if [ -z "$suffix" ]; then
                echo "ghcr.io/ceki-me/docker-browser:latest"
              else
                echo "ghcr.io/ceki-me/docker-browser:${suffix#-}"
              fi
              if [ "$HUB" = "1" ]; then
                if [ -z "$suffix" ]; then
                  echo "ceki/provider:latest"
                else
                  echo "ceki/provider:${suffix#-}"
                fi
              fi
              if [ -n "${{ github.event.release.tag_name }}" ]; then
                echo "ghcr.io/ceki-me/docker-browser:${{ github.event.release.tag_name }}${suffix}"
                if [ "$HUB" = "1" ]; then
                  echo "ceki/provider:${{ github.event.release.tag_name }}${suffix}"
                fi
              fi
            } > "/tmp/tags${file_suffix}"
          }
          write_set ""
          write_set "-yandex"
          write_set "-pseudo-yandex"
          # Output names use underscores (tags_yandex, not tags-yandex):
          # hyphens in expression identifiers are parsed as subtraction.
          for s in _chromium _yandex _pseudo_yandex; do
            {
              echo "tags${s}<<__CEKI_EOF__"
              cat "/tmp/tags${s}"
              echo "__CEKI_EOF__"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Build and push (chromium)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags_chromium }}

      - name: Build and push (yandex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.yandex
          push: true
          tags: ${{ steps.tags.outputs.tags_yandex }}

      - name: Build and push (pseudo-yandex)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pseudo-yandex
          push: true
          tags: ${{ steps.tags.outputs.tags_pseudo_yandex }}

      - name: Make GHCR package public
        # GHCR creates container packages private by default, even in a public
        # repo, so anonymous `docker pull` is denied until the visibility is
        # flipped. The pushed image lives either repo-scoped or org-scoped
        # (Ceki-me is an organization) — probe both and PUT visibility=public
        # on whichever the GITHUB_TOKEN can address. If none works the job does
        # not fail — it warns, and the image stays private until someone flips
        # it once in the Packages UI.
        env:
          ADMIN_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
        run: |
          set +e
          ORG="${GITHUB_REPOSITORY_OWNER}"
          put() {
            curl -sS -o /tmp/visresp -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$2/visibility" \
              -d '{"visibility":"public"}'
          }
          # Primary GITHUB_TOKEN attempt: repo-scoped, then org-scoped.
          for scope in "repos/${GITHUB_REPOSITORY}/packages/container/docker-browser" \
                       "orgs/${ORG}/packages/container/docker-browser"; do
            code=$(put "${{ secrets.GITHUB_TOKEN }}" "$scope")
            echo "$scope -> HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "GHCR package visibility set to public (GITHUB_TOKEN, $scope)"
              exit 0
            fi
          done
          # Fall back to a classic-PAT secret (write:packages) if provided.
          if [ -n "$ADMIN_TOKEN" ]; then
            for scope in "repos/${GITHUB_REPOSITORY}/packages/container/docker-browser" \
                         "orgs/${ORG}/packages/container/docker-browser"; do
              code=$(put "$ADMIN_TOKEN" "$scope")
              echo "$scope (PAT) -> HTTP $code"
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "GHCR package visibility set to public (PACKAGES_ADMIN_TOKEN, $scope)"
                exit 0
              fi
            done
          else
            echo "PACKAGES_ADMIN_TOKEN not set"
          fi
          echo "::warning::could not flip GHCR package visibility — set PACKAGES_ADMIN_TOKEN (classic PAT, write:packages) or flip it once in the Packages UI"
          exit 0
